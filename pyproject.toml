[project]
name = "pontelo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 120
# EXE002: arquivos montados do Windows aparecem como executáveis; B008: Depends() é idiomático no FastAPI;
# BLE001: worker e teste capturam tudo de propósito (retentativa / coleta de erro).
lint.ignore = ["EXE002", "B008", "BLE001"]
